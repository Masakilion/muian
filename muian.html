<style>
  :root{

  }
  nav button{
    flex:1; min-width:80px; padding:12px 6px; border:none; background:none;
    font-family:inherit; font-size:13px; color:#8a7f6d; cursor:pointer;
    border-bottom:3px solid transparent; white-space:nowrap;
  }
  nav button.active{ color:var(--vermilion); border-bottom-color:var(--vermilion); font-weight:600;}
  main{ max-width:900px; margin:0 auto; padding:18px 16px 60px;}
  .pane{ display:none; }
  .pane.on{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  #chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .chip{
    padding:8px 13px; border:1px solid var(--line); border-radius:20px; background:var(--paper2);
    font-family:inherit; font-size:12.5px; color:var(--ink); cursor:pointer; min-height:36px;
  }
  .chip:active{ background:var(--gold); }

  #log{ min-height:120px; margin-bottom:14px; }
  .empty-hint{ color:#9a8f7d; font-size:13px; padding:30px 10px; text-align:center; }

  .msg{ margin-bottom:14px; }
  .msg.user{ text-align:right; }
  .msg.user .bubble{
    display:inline-block; background:var(--vermilion); color:#fff;
    padding:10px 15px; border-radius:14px 14px 2px 14px; max-width:85%; text-align:left;
    font-size:14px;
  }
  .card{
    border:1px solid var(--line); border-left:5px solid var(--card-color, var(--gold));
    background:#fffdf8; border-radius:6px; padding:14px 16px; margin-bottom:10px;
    animation:fade .35s ease;
  }
  .card .who{ font-weight:600; font-size:14px; margin-bottom:6px; color:var(--card-color, var(--ink)); }
  .card .quote{ font-style:italic; font-size:14.5px; margin:6px 0; line-height:1.9; }
  .card .yomi{ font-size:12.5px; color:#6b6152; margin:2px 0; }
  .card .src{ font-size:11.5px; color:#9a8f7d; margin-bottom:6px; }
  .card .modern{ font-size:12px; color:#7a6f5f; margin-bottom:10px; padding-left:8px; border-left:2px solid var(--line); }
  .card .answer{ font-size:14.5px; }

    border:1px solid var(--gold); border-radius:6px; background:#fbf4e4;
    padding:12px 16px; margin-bottom:14px; animation:fade .3s ease;

  .gist .text{ font-size:14px; line-height:1.7; }
  .gist .note{ font-size:11.5px; color:#9a8f7d; margin-top:6px; }

  .askmore{

    cursor:pointer; min-height:40px;

  .suggest-hint{ flex-basis:100%; font-size:12px; color:#9a8f7d; margin-bottom:2px; }

  .inputbar{
    display:flex; gap:8px; position:sticky; bottom:0; background:var(--bg);
    padding:10px 0 4px; border-top:1px solid var(--line);
  }
  .inputbar input{
    flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:22px;
    font-family:inherit; font-size:16px; background:#fff; color:var(--ink);
  }
  .inputbar button{
    padding:0 20px; border:none; border-radius:22px; background:var(--vermilion); color:#fff;
    font-family:inherit; font-size:14px; cursor:pointer; min-height:44px;

  .profile{
    border:1px solid var(--line); border-top:4px solid var(--p-color,var(--gold));

  .profile .era{ font-size:11.5px; color:#9a8f7d; margin-bottom:10px; }
  .profile dl{ margin:0; }
  .profile dt{ font-size:12px; color:#8a7f6d; margin-top:8px; }
  .profile dd{ margin:2px 0 0; font-size:13.5px; }

  .term{
    border-bottom:1px solid var(--line); padding:10px 2px; display:flex; gap:12px; align-items:baseline;
  }
  .term .t{ font-weight:600; min-width:110px; flex-shrink:0; }
  .term .p{ font-size:11px; color:#fff; background:var(--t-color,#999); border-radius:10px; padding:2px 8px; flex-shrink:0; }
  .term .d{ font-size:13px; color:#5a5044; }

  /* Compare table */
  .tablewrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.compare{ border-collapse:collapse; width:100%; min-width:760px; font-size:12.5px; }
  table.compare th, table.compare td{ border:1px solid var(--line); padding:9px 10px; vertical-align:top; text-align:left; }
  table.compare th{ background:var(--paper2); font-weight:600; }
  table.compare th.axis{ background:#e9e1cd; min-width:90px; }
  table.compare td.axis{ background:#e9e1cd; font-weight:600; }

  footer{ text-align:center; padding:24px 16px 40px; font-size:11.5px; color:#9a8f7d; border-top:1px solid var(--line); margin-top:20px; }
  footer a{ color:#9a8f7d; }

  @media (max-width:640px){
    header h1{ font-size:24px; }
    main{ padding:14px 12px 50px; }
    nav button{ font-size:12px; padding:11px 4px; }
    .msg.user .bubble{ max-width:92%; }
    table.compare{ font-size:11.5px; }
    input, select, textarea{ font-size:16px !important; } /* iOSの自動ズーム防止 */
  }
</style>

    { k:"善攝生者、陸行不遇兕虎、入軍不被甲兵。兕無所投其角、虎無所措其爪、兵無所容其刃。夫何故、以其無死地。",
      y:"善く生を摂する者は、陸行くも兕虎に遇わず、軍に入るも甲兵を被らず。兕はその角を投ずる所無く、虎はその爪を措く所無く、兵はその刃を容るる所無し。それ何の故ぞ、その死地無きを以てなり。",
      src:"『道徳経』第50章",
      m:"うまく生を養う者は、陸を歩いても犀や虎に出会わず、戦場に入っても武具を身につける必要がない。犀はその角を突き立てる隙がなく、虎はその爪をかける隙がなく、武器はその刃を突き立てる隙がない。なぜか。彼には「死の入り込む場所」がないからだ。",
      a:"死を過剰に恐れ、生にしがみつくほど、かえって死は身近な脅威として迫ってきます。老子が言う「死地が無い」とは、命を粗末にすることではなく、生への執着に自らを固く縛りつけないということ。柔らかく開かれた心には、死が入り込んで脅かす隙間そのものがないのです。" },
    { k:"飄風不終朝、驟雨不終日。孰為此者、天地。天地尚不能久、而況於人乎。",
      y:"飄風は朝を終えず、驟雨は日を終えず。孰か此れを為す者ぞ、天地なり。天地すら尚お久しきこと能わず、而るを況んや人においてをや。",
      src:"『道徳経』第23章",
      m:"つむじ風は一朝じゅう吹き続けることはなく、にわか雨は一日じゅう降り続けることはない。誰がこれを起こしているのか。天地である。天地でさえ物事を永遠に続けることはできないのに、まして人間はなおさらである。",
      a:"老いや衰えを、自分だけに起きる特別な不幸のように感じていませんか。しかし天地でさえ、嵐も雨も永遠には続けられません。すべてのものは移ろい、留まることがないのです。それは冷たい真実であると同時に、あなたの苦しみもまた永遠には続かないという慰めでもあります。" }
  ],
  oV:{
    soshi:[
      { q:"鼓盆而歌 ―『荘子』至楽篇", a:"妻を亡くした荘子は盆を叩いて歌いました。友人が驚くと彼は言います、「生まれる前は気ですらなかった。今また気に戻るだけ、それは四季の巡りと同じだ」と。悲しみを否定はしませんが、死もまた自然な物化なのです。" },
      { q:"混沌の寓話 ―『荘子』応帝王篇", a:"南海の帝と北海の帝は、目も鼻もない中央の帝・混沌に感謝しようと、七つの穴を一日一つずつ開けてやりました。七日目、混沌は死んでしまいます。老いや死に人為の穴をこじ開けようとせず、自然な移ろいのままに任せてごらんなさい。" },
      { q:"髑髏との対話 ―『荘子』至楽篇", a:"荘子は野に転がる髑髏を枕に眠ると、夢の中でその髑髏が語りかけてきました。死者には君主も臣下もなく、四季の煩わしさもない、この楽しみは王者の楽しみにも勝ると。死を一方的に不幸と決めつけているのは、生きている側かもしれません。" },
      { q:"相濡以沫 ―『荘子』大宗師篇", a:"泉が涸れ、打ち上げられた魚たちは互いの体を湿らせ合って助け合います。しかしそれは、広い江湖で互いを忘れて泳いでいた頃には及びません。大切な人を失った悲しみの中でも、いずれその人を大いなる流れの中で自然に思い出せる日が来ます。" },
      { q:"方生方死 ―『荘子』斉物論篇", a:"生まれるとは同時に死に向かうことであり、死ぬとはまた同時に生まれることでもある、と荘子は説きます。生と死を切り離された二つの出来事として恐れるのではなく、一続きの大きな移ろいとして眺めてごらんなさい。" }
    ],
    epicurus:[
      { q:"死は我々にとって何ものでもない ―『メノイケウス宛の手紙』", a:"我々が存在する限り死は存在せず、死が来た時にはもう我々は存在しません。だから死は経験されることのないものです。恐れるべきは死そのものではなく、死への漠然とした想像なのです。" },
      { q:"快楽は長さでなく質による ―『主要教説』", a:"エピクロスは、限りある時間の快楽も、理性によって計れば無限の時間の快楽と同じだけの大きさを持ちうると説きました。長く生きられたかどうかより、その生をどれだけ深く味わえたかを、大切な人の人生について思い出してごらんなさい。" },
      { q:"友情は死の悲しみを分かち合う ―『主要教説』", a:"エピクロスは友情をあらゆる善の中で最大のものとしました。喪失の悲しみを一人で抱え込む必要はありません。共に悲しみ、共に故人を語ってくれる友のそばにいることが、何よりの慰めになります。" },
      { q:"老いは人生の完成に近い ―『メノイケウス宛の手紙』", a:"エピクロスは、若い頃には早く老いることを恐れる必要はなく、老いてからは若さを惜しむ必要はないと説きました。人生の各時期にはそれぞれの快があります。老いを喪失としてだけでなく、味わいの一つとして眺めてごらんなさい。" },
      { q:"死への恐れは推測にすぎない ―『メノイケウス宛の手紙』", a:"死そのものを経験することは誰にもできません。恐れているのは死ではなく、死についての想像にすぎないとエピクロスは言います。想像で自分を苦しめる代わりに、今生きているこの時間を丁寧に味わってごらんなさい。" }
    ],
    schopenhauer:[
      { q:"個体性の消滅は苦しみからの解放 ―『意志と表象としての世界』", a:"死とは、個体という仮の姿が消え、盲目的な生への意志の苦しみから解かれることです。恐れるべきものというより、むしろ救いに近いのです。" },
      { q:"個体化の原理という覆い ―『意志と表象としての世界』", a:"あなたと亡くなった方を全く別々の存在として隔てているのは、時間と空間という個体化の原理という一枚の覆いにすぎません。その覆いの奥では、すべてが一つの意志として繋がっているとショーペンハウアーは説きました。" },
      { q:"老いとは意志の衰えゆく姿 ―『意志と表象としての世界』", a:"老いによって欲望や執着が薄れていくのは、盲目的な生への意志そのものが弱まっていく証だとショーペンハウアーは考えました。それは喪失であると同時に、長く駆り立てられ続けた渇きからの、ゆるやかな解放でもあります。" },
      { q:"苦痛と退屈の振り子の停止 ―『意志と表象としての世界』", a:"生きるとは、苦痛と退屈の間を絶えず揺れ動く振り子だとショーペンハウアーは言いました。死とはこの終わりのない振り子がついに止まることです。恐れるべきものというより、長い労苦の後の静止と見ることもできます。" },
      { q:"芸術的観照が教える無時間性 ―『意志と表象としての世界』", a:"美に深く没入する瞬間、私たちは時間の外に立ち、個体としての生死を超えた何かに触れます。大切な人を失っても、その人と分かち合った美しい記憶は、時間に消されない場所に確かに残り続けます。" }
    ],
    heidegger:[
      { q:"死への先駆(Vorlaufen zum Tode) ―『存在と時間』", a:"死は誰も代わってあげられない、あなただけのものです。それを直視することで初めて、残された生を本当に自分のものとして生きられるようになります。" },
      { q:"世人(das Man)の死 ―『存在と時間』", a:"「人はいつか死ぬものだ」という世間一般の言い方は、死を他人事として遠ざけてしまいます。ハイデガーは、死とは誰の代わりにもなれない、あなただけのものだと言います。喪失を前にした今こそ、その一般論から一度離れてごらんなさい。" },
      { q:"本来性への転換 ―『存在と時間』", a:"大切な人の死は、日常に埋没していた私たちを立ち止まらせ、自分もまた限りある存在であることを否応なく突きつけます。この痛みを、本来の自分の生き方を問い直す機会として、ハイデガーは捉えました。" },
      { q:"不安(Angst) ―『存在と時間』", a:"死や老いを前にした漠然とした不安は、何か特定の対象への恐れではありません。存在そのものの有限性に触れているからこそ生まれる、根源的な気分です。それを紛らわせず、静かに向き合ってみてください。" },
      { q:"放下(Gelassenheit) ―後期講演集", a:"老いや死を意のままにコントロールしようとする構えを手放し、あるがままに委ねる態度をハイデガーは「放下」と呼びました。抗えないものと戦い続けるより、委ねることの中に見えてくる静けさがあります。" }
    ],
    spinoza:[
      { q:"永遠の相の下に ―『エチカ』", a:"賢者は死について思い煩うことが最も少なく、その知恵は生についての瞑想にあります。物事を永遠の相の下で捉えれば、個の消滅への恐れは小さくなっていきます。" },
      { q:"精神の永遠なる部分 ―『エチカ』", a:"スピノザは、精神は身体が滅んでもなお、その一部が永遠であると考えました。存在し続けようとするコナトゥスの働きは、単純な消滅では終わらないのです。喪失の中にも、消えないものがあると知ってください。" },
      { q:"神即自然 ―『エチカ』", a:"スピノザにとって、個々のものは唯一の実体である神即自然の様態にすぎません。大切な人を失っても、その人を構成していたものは、この大きな自然の中で形を変えて存在し続けています。" },
      { q:"適切な観念による感情の理解 ―『エチカ』", a:"老いや死への恐れは、多くの場合、それらを漠然としか理解していないことから強まります。老いの過程や死の必然性を明晰に理解しようと努めることが、かえってその感情の力を和らげてくれます。" },
      { q:"知的愛という能動的な喜び ―『エチカ』", a:"スピノザは、神への知的愛を人が到達しうる最高の喜びとしました。それは移ろう個物への執着ではなく、全体の秩序を理解する喜びです。悲しみに沈む時こそ、より大きな全体との繋がりに目を向けてごらんなさい。" }
    ]
  }},
{ id:"work", label:"仕事・努力・頑張りすぎ",
  kw:["仕事","努力","頑張り","頑張って","頑張りすぎ","燃え尽き","バーンアウト","働き","残業","忙し","キャリア","出世","昇進","転職","職場","上司","ノルマ","締め切り","納期","休めない","休みたい","労働","辞めたい","会社行きたくない","出社したくない","月曜がつらい","異動","過労","サビ残","モチベーション上がらない"],
  kwWeak:["だるい","しんどい","きつい","つらい","めんどくさい","疲れ","疲れた","限界","眠れない","テンション低い","やる気でない","泣きたい","もう無理","気力がない"],
  feat:["soshi","schopenhauer"],
  gist:"六人に共通するのは、力ずくで結果を握りしめるのをやめ、無理のない力の使い方を見直せという方向性です。",
  laoziV:[
    { k:"為者敗之、執者失之。是以聖人無為故無敗、無執故無失。",
      y:"為す者はこれを敗り、執る者はこれを失う。ここを以て聖人は無為なるが故に敗るる無く、執する無きが故に失う無し。",
      src:"『道徳経』第64章",
      m:"無理に何かを成そうとする者はかえって失敗し、しがみつく者はかえって失う。だから聖人は無理に為さないから失敗せず、しがみつかないから失わない。",
      a:"頑張りすぎるとは、結果を握りしめようとする力みです。川の流れに逆らって漕ぎ続ければ、いずれ力尽きてしまいます。無為とは怠けることではなく、物事の自然な流れに逆らわず、力を最も効率よく使うことです。力を抜くところを知る者こそ、長く働き続けられるのです。" },
    { k:"曲則全、枉則直、窪則盈、敝則新、少則得、多則惑。……夫唯不爭、故天下莫能與之爭。",
      y:"曲なれば則ち全く、枉なれば則ち直く、窪めば則ち盈ち、敝るれば則ち新たに、少なければ則ち得、多ければ則ち惑う。……それ唯争わず、故に天下能くこれと争う莫し。",
      src:"『道徳経』第22章",
      m:"曲がっているものはかえって全うされ、ゆがんでいるものはかえってまっすぐになる。窪んでいればかえって満たされ、古びていればかえって新しくなる。少なければかえって得られ、多く求めればかえって惑う。……ただ争わないからこそ、天下の誰もその人と争うことができない。",
      a:"頑張りすぎて自分をまっすぐに正そう、完璧にしようとするほど、かえって物事はうまくいかなくなるものです。少し曲がっていること、まだ満たされていないことを許してごらんなさい。窪んだ器だからこそ水が満ちるように、力を抜いた状態こそが、次に満たされる余地を残しているのです。多くを求めすぎる心が、あなたを惑わせています。" },
    { k:"天之道、損有餘而補不足。……是以聖人為而不恃、功成而不處。",
      y:"天の道は、有余を損じて不足を補う。……ここを以て聖人は為して恃まず、功成りて処らず。",
      src:"『道徳経』第77章",
      m:"天の道は、余っているところを減らし、足りないところを補う。……だから聖人は、何かを為してもそれをあてにせず、成果を上げてもそこに居座らない。",
      a:"頑張って積み上げた成果に、いつまでもしがみついていませんか。天の道は、余ったものを減らし、足りないものへと絶えず巡らせていきます。あなたも、成し遂げたことを誇り続けるのではなく、次へと力を巡らせてごらんなさい。成果に居座らない者こそ、疲れ果てずに長く働き続けられるのです。" }
  ],
  oV:{
    soshi:[
      { q:"庖丁解牛 ―『荘子』養生主篇", a:"名料理人・庖丁の刃は、骨と骨の隙間を自然に沿って動くので何年経っても刃こぼれしません。力任せに切る者はすぐ刃を傷めます。仕事も同じ、物事の理に沿って動けば疲れは少ないのです。" },
      { q:"朝三暮四 ―『荘子』斉物論篇", a:"猿使いが橡の実を「朝三つ夕四つ」から「朝四つ夕四つ」に変えただけで猿は喜びました。実は総量は同じです。残業や成果の配分に一喜一憂する前に、自分が本当に何を得ているのか数えてごらんなさい。" },
      { q:"櫟社の木 ―『荘子』人間世篇", a:"材木にならないと笑われた社の櫟は、切られず大樹となり人々に涼しい木陰を与えました。役に立つと目された木から先に伐られるのです。会社の物差しで自分の価値を測るのをおやめなさい、無用こそが身を全うする道です。" },
      { q:"佝僂丈人 ―『荘子』達生篇", a:"背の曲がった老人は竿の先に玉を積む修練を重ね、ついに枝の蝉をまるで手で拾うように捕らえました。焦って量をこなすより、心を一つに定めて向き合うことが、疲れずに仕事を極める道です。" },
      { q:"螳螂の斧 ―『荘子』人間世篇", a:"蟷螂は自分の力量も知らず、斧のような前脚を振り上げて車の轍に立ち向かいます。頑張りすぎるあなたも、己の限界を知らぬまま重すぎる荷を引き受けていないでしょうか。まず自分の器を知ることです。" }
    ],
    epicurus:[
      { q:"隠れて生きよ(λάθε βιώσας)", a:"名声や出世のための労苦は、自然で必要な欲求を超えた空虚な欲望であることが多いのです。友と穏やかに過ごす簡素な生活にこそ、真の快が宿ります。" },
      { q:"快楽計算 ―『主要教説』", a:"エピクロスは快楽と苦痛を天秤にかけて選ぶことを説きました。今の仕事がもたらす苦労と、それが本当に生む快楽を紙に書き出してごらんなさい。労力に見合わない仕事に気づくはずです。" },
      { q:"自然で必要な欲求 ―『メノイケウス宛の手紙』", a:"欲求には自然で必要なもの、自然だが不必要なもの、空虚なものの三種があります。出世や他人との比較のための努力は多くが空虚な欲望です。本当に必要なものはごくわずかだと知れば、肩の力が抜けます。" },
      { q:"アタラクシア(魂の平静) ―快楽主義の目標", a:"エピクロスにとって最高の快とは興奮ではなく、乱されない心の平静(アタラクシア)でした。成果を積み上げることばかりに気を取られず、一日の終わりに心が穏やかであるかを基準にしてごらんなさい。" },
      { q:"簡素な生活 ―『主要教説』", a:"パンと水があれば満足だとエピクロスは語りました。贅沢な暮らしを支えるための労働が、あなたを縛っていないでしょうか。必要を減らすことは、自由を増やすことと同じなのです。" }
    ],
    schopenhauer:[
      { q:"意志は満たされても新たな欠乏を生む ―『意志と表象としての世界』", a:"働いても働いても満たされないのは、達成が新たな欲望を生むだけだからです。仕事の合間に、利害を離れた芸術的観照の時間を持つことが、意志の渇きから一時逃れる術になります。" },
      { q:"苦痛と退屈の間の振り子 ―『意志と表象としての世界』", a:"人生は苦痛と退屈の間を振り子のように揺れ動きます。仕事に追われる苦痛から逃れようと休んでも、今度は虚しい退屈に襲われる。この構造そのものを知れば、働きすぎる自分を責める必要はなくなります。" },
      { q:"生への意志 ―『意志と表象としての世界』", a:"出世や成果を求めて止まない衝動は、あなた個人の意志というより、生きとし生けるものを駆り立てる盲目的な「生への意志」の表れです。その正体を見抜くだけでも、駆り立てられる感覚は和らぎます。" },
      { q:"個体化の原理 ―『意志と表象としての世界』", a:"他人に負けまいと競う努力は、自分と他人を切り離す「個体化の原理」に囚われた見方から生まれます。根底では皆が同じ一つの意志を生きていると見れば、競争に注ぐ力は少し軽くなるでしょう。" },
      { q:"芸術的観照による一時の解放 ―『意志と表象としての世界』", a:"仕事の合間にただ美しい音楽や景色に見入る時間を持ちなさい。その一瞬、あなたは欲望に駆られる主体であることをやめ、静かな観照者になれます。この短い解放が、意志の消耗から心を守ります。" }
    ],
    heidegger:[
      { q:"世人(das Man)への頽落 ―『存在と時間』", a:"「みんなが頑張っているから」という世間の声に流され、本来の自分の可能性を見失っていませんか。自分自身の死という限界を見つめ直すことで、何が本当に大切かが見えてきます。" },
      { q:"頽落(Verfallen)と道具的存在 ―『存在と時間』", a:"仕事に没頭するあまり、自分がただの「役に立つ道具」になっていませんか。現存在であるあなたは道具以上の存在です。目の前の作業から一歩退き、自分自身の在り方を問い直す時間を持ちなさい。" },
      { q:"放下(Gelassenheit) ―『放下』", a:"すべてを意のままに掌握しようとする構えを手放すことをハイデガーは「放下」と呼びました。頑張りとは対極にある、物事をあるがままに委ねる態度です。力を抜いて委ねることも、一つの生き方です。" },
      { q:"配慮的気遣い(Fürsorge)の歪み ―『存在と時間』", a:"他者のためにと思ってする過剰な労働は、実は相手の可能性を奪う気遣いになっていないでしょうか。本来の配慮とは、相手が自分自身であり続けられるよう支えることです。まず自分自身を気遣いなさい。" },
      { q:"死への先駆 ―『存在と時間』", a:"人はいつか必ず死ぬという事実から目を逸らし、際限なく仕事に自分を投げ込んではいないでしょうか。有限な時間を意識することで初めて、何にどれだけの力を注ぐべきかが本来の姿で見えてきます。" }

    spinoza:[
      { q:"コナトゥス ―『エチカ』", a:"すべてのものは自己の存在を維持しようとする力(コナトゥス)を持ちます。それに反する無理な労働は、あなたの活動能力を減らす受動感情を生みます。喜びを増す仕事を選びなさい。" },
      { q:"能動的原因 ―『エチカ』第三部", a:"ある行動があなた自身の本性から生まれる時、あなたは能動的です。しかし他人の評価や不安に急かされてする労働は受動的な行いです。その仕事が自分の内から出た力によるものか、問い直してごらんなさい。" },
      { q:"適切な観念 ―『エチカ』第二部", a:"漠然とした焦りに突き動かされて働くのは、物事を混乱した観念のまま捉えているからです。何のために、何を、どれだけ働くのかを理性で明晰に把握し直せば、無闇な頑張りは自然と鎮まります。" },
      { q:"永遠の相の下に(sub specie aeternitatis) ―『エチカ』", a:"目先の締切や評価に心を奪われている時、あなたは物事を一時的な相の下でしか見ていません。永遠の相の下に、つまり大きな時間の流れの中で今の仕事を眺め直せば、その重さは自ずと変わって見えます。" },
      { q:"自由な人間の思慮 ―『エチカ』第四部", a:"自由な人間とは死を恐れず、理性に従って生きる人だとスピノザは説きました。恐れに駆られて働き詰めになるのではなく、自分の力を最もよく活かせる行動は何かを、理性で静かに選び取りなさい。" }
    ]
  }},

      src:"『道徳経』第81章",

  oV:{

      { q:"虚舟の喩え ―『荘子』山木篇", a:"空舟が自分の船にぶつかっても人は怒りません、しかし誰かが操っていたと分かれば怒鳴ります。相手の中に「敵意」を見出すのは、あなた自身の心が作り出した虚舟かもしれません。" },
      { q:"魚の楽しみ ―『荘子』秋水篇", a:"荘子が「魚は楽しそうだ」と言うと、恵子は「魚でないあなたに魚の楽しみが分かるものか」と返しました。相手の心の内をすべて分かったつもりで怒るのは早計です。本当は分からないという謙虚さが関係を救います。" },

      { q:"友情は最高の善の一つ ―『主要教説』", a:"エピクロスの園では友情こそ人生の安らぎの柱でした。すべての人間関係に完璧を求めず、心から信頼できる少数の友を大切にすることが、平静への道です。" },

      { q:"個体化の原理 ―『意志と表象としての世界』", a:"相手を「自分とは別の敵」と見なすのは、個体化の原理によって世界を切り分けて見る癖のせいです。根底ではすべてが同じ一つの意志の表れだと見抜けば、憎しみは幾分和らいでいくでしょう。" },

      { q:"本来性と非本来性 ―『存在と時間』", a:"世間の常識に照らして「許すべきか許さざるべきか」を判断するのではなく、あなた自身がどう在りたいかという本来の問いに立ち返りなさい。答えは他人の物差しの外にあります。" },
      { q:"不安(Angst) ―『存在と時間』", a:"相手への怒りの奥に、実は自分の存在そのものへの漠然とした不安が潜んでいることがあります。相手を責める前に、その不安の正体が何なのか、自分自身に静かに問いかけてみてください。" },

      { q:"永遠の相の下に(sub specie aeternitatis) ―『エチカ』第五部", a:"一つの出来事を、今この瞬間の感情ではなく永遠の相の下に眺めてごらんなさい。長い時間の流れの中で見た時、その裏切りや衝突がどれほどの重みを持つのか、違って見えてくるはずです。" }

  oV:{

      { q:"呆若木鶏 ―『荘子』達生篇", a:"一流の闘鶏は、勝ち負けに一喜一憂せず木彫りのように落ち着き払っていました。過去の失敗を今も引きずって心を波立たせるのではなく、木鶏のようにどっしりと構え直すところから、次の一歩は始まります。" }

function detectTheme(text){
  let best=null, bestScore=0;
  THEMES.forEach(th=>{
    let score=0;
    th.kw.forEach(k=>{ if(text.includes(k)) score+=2; });
    if(th.kwWeak){ th.kwWeak.forEach(k=>{ if(text.includes(k)) score+=1; }); }
    if(score>bestScore){ bestScore=score; best=th; }
  });
  return bestScore>0 ? best : null;
}

function makeCard(id, whoLabel, quote, yomi, src, modern, answerText){
  const p = PHILOSOPHERS[id];
  const card = document.createElement("div");
  card.className = "card";
  card.style.setProperty("--card-color", p.c);
  let html = '<div class="who"></div>';
  if(quote) html += '<div class="quote"></div>';
  if(yomi) html += '<div class="yomi"></div>';
  if(src) html += '<div class="src"></div>';
  if(modern) html += '<div class="modern"></div>';
  html += '<div class="answer"></div>';
  card.innerHTML = html;
  card.querySelector(".who").textContent = whoLabel;
  if(quote) card.querySelector(".quote").textContent = quote;
  if(yomi) card.querySelector(".yomi").textContent = yomi;
  if(src) card.querySelector(".src").textContent = src;
  if(modern) card.querySelector(".modern").textContent = modern;
  card.querySelector(".answer").textContent = answerText;
  return card;
}

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

  return div;
}

  theme.feat.forEach((pid, idx)=>{
    setTimeout(()=>{
      const o = pick(theme.oV[pid]);
      logEl.appendChild(makeCard(pid, PHILOSOPHERS[pid].name, null, null, o.q, null, o.a));
      logEl.scrollTop = logEl.scrollHeight;
    }, delays[idx]);
  });

  setTimeout(()=>{
    const remaining = OTHERS.filter(id=> !theme.feat.includes(id));
    remaining.forEach(pid=>{
      const btn = document.createElement("button");
      btn.className = "askmore";
      btn.style.setProperty("--btn-color", PHILOSOPHERS[pid].c);
      btn.textContent = PHILOSOPHERS[pid].name + "にも聞く";
      btn.onclick = ()=>{
        const o = pick(theme.oV[pid]);
        logEl.appendChild(makeCard(pid, PHILOSOPHERS[pid].name, null, null, o.q, null, o.a));
        logEl.scrollTop = logEl.scrollHeight;
        btn.remove();
      };
      moreRowEl.appendChild(btn);
    });
  }, 1600);
}

function respondFallback(){
  setTimeout(()=>{
    const text = FALLBACK[Math.floor(Math.random()*FALLBACK.length)];
    logEl.appendChild(makeCard("laozi", "老子", null, null, null, null, text));
    logEl.scrollTop = logEl.scrollHeight;
    showSuggestions();
  }, 150);
}

function showSuggestions(){
  moreRowEl.innerHTML = "";
  const hint = document.createElement("div");
  hint.className = "suggest-hint";
  hint.textContent = "近いテーマはこちらでしょうか:";
  moreRowEl.appendChild(hint);
  const pool = THEMES.slice();
  for(let i=pool.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  pool.slice(0,3).forEach(th=>{
    const btn = document.createElement("button");
    btn.className = "askmore";
    btn.textContent = th.label;
    btn.onclick = ()=> ask(th.label, th.id);
    moreRowEl.appendChild(btn);
  });
}

function ask(text, forcedThemeId){
  text = (text||"").trim();
  if(!text) return;
  appendUserMsg(text);
  qInput.value = "";
  moreRowEl.innerHTML = "";
  const theme = forcedThemeId ? THEMES.find(t=>t.id===forcedThemeId) : detectTheme(text);
  if(theme){ respond(theme); } else { respondFallback(); }
}

document.getElementById("ask").onclick = ()=> ask(qInput.value);
qInput.addEventListener("keydown", e=>{ if(e.key==="Enter") ask(qInput.value); });

/* ============ 哲学者たちタブ ============ */
const libEl = document.getElementById("library");
PROFILES.forEach(pr=>{
  const p = PHILOSOPHERS[pr.id];
  const div = document.createElement("div");
  div.className = "profile";
  div.style.setProperty("--p-color", p.c);
  div.innerHTML =
    '<h3></h3><div class="era"></div><dl>'+
    '<dt>主著</dt><dd class="d-work"></dd>'+
    '<dt>思想</dt><dd class="d-thought"></dd>'+
    '<dt>老子との関係</dt><dd class="d-rel"></dd>'+
    '</dl>';
  div.querySelector("h3").textContent = p.name;
  div.querySelector(".era").textContent = p.era;
  div.querySelector(".d-work").textContent = pr.work;
  div.querySelector(".d-thought").textContent = pr.thought;
  div.querySelector(".d-rel").textContent = pr.rel;
  libEl.appendChild(div);
});

/* ============ 概念事典タブ ============ */
const glossEl = document.getElementById("glossary");
TERMS.forEach(term=>{
  const p = PHILOSOPHERS[term.p];
  const div = document.createElement("div");
  div.className = "term";
  div.innerHTML = '<span class="t"></span><span class="p"></span><span class="d"></span>';
  div.querySelector(".t").textContent = term.t;
  const pEl = div.querySelector(".p");
  pEl.textContent = p.name;
  pEl.style.setProperty("--t-color", p.c);
  div.querySelector(".d").textContent = term.d;
  glossEl.appendChild(div);
});

/* ============ 比較表タブ ============ */
const cmpEl = document.getElementById("compare");
(function(){
  const wrap = document.createElement("div");
  wrap.className = "tablewrap";
  const table = document.createElement("table");
  table.className = "compare";
  const order = ["laozi","soshi","epicurus","schopenhauer","heidegger","spinoza"];
  let thead = "<thead><tr><th class='axis'>軸</th>";
  order.forEach(id=>{ thead += "<th>"+PHILOSOPHERS[id].name+"</th>"; });
  thead += "</tr></thead>";
  let tbody = "<tbody>";
  COMPARE_AXES.forEach((axis, i)=>{
    tbody += "<tr><td class='axis'>"+axis+"</td>";
    order.forEach(id=>{ tbody += "<td>"+COMPARE[id][i]+"</td>"; });
    tbody += "</tr>";
  });
  tbody += "</tbody>";
  table.innerHTML = thead + tbody;
  wrap.appendChild(table);
  cmpEl.appendChild(wrap);
})();
</script>
